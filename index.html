<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ARTILLERY">
<meta name="twitter:description" content="2-player tank duel. Set angle and power, watch the wind, FIRE.">
<meta name="twitter:image" content="https://mrchumley.github.io/artillery/preview.png">
<meta property="og:title" content="ARTILLERY">
<meta property="og:description" content="2-player tank duel. Set angle and power, watch the wind, FIRE.">
<meta property="og:image" content="https://mrchumley.github.io/artillery/preview.png">
<meta property="og:url" content="https://mrchumley.github.io/artillery/">
<title>ARTILLERY</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#000;color:#6f6;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  h1{font-size:18px;letter-spacing:6px;margin:8px 0;font-weight:normal;}
  canvas{width:640px;height:400px;border:2px solid #3a3;background:#000;box-shadow:0 0 24px #040;image-rendering:pixelated;image-rendering:crisp-edges;}
  .row{margin:10px 0;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;}
  input,select{background:#000;color:#6f6;border:1px solid #3a3;font-family:inherit;font-size:14px;padding:2px 4px;}
  input[type=number]{width:56px;}
  #room{width:170px;}
  button{background:#000;color:#6f6;border:1px solid #6f6;font-family:inherit;padding:3px 12px;cursor:pointer;}
  button:disabled{opacity:.4;cursor:default;}
  #msg,#net{min-height:18px;font-size:13px;}
  #net{opacity:.8;}
</style>
</head>
<body>
<h1>ARTILLERY</h1>
<canvas id="c" width="320" height="200"></canvas>
<div class="row">
  P<span id="who">1</span>
  ANGLE <input id="ang" type="number" value="45" min="1" max="179">
  POWER <input id="pow" type="number" value="50" min="1" max="100">
  WIND <span id="wind">0</span>
  <button id="fire">FIRE</button>
  <button id="reset">RESET</button>
  <select id="mode">
    <option value="pvp">2P local</option>
    <option value="cpu">vs CPU</option>
  </select>
</div>
<div class="row">
  <button id="host">HOST</button>
  <input id="room" placeholder="room or @handle">
  <button id="join">JOIN</button>
  <span id="net">offline</span>
</div>
<div id="msg">Set angle + power, then FIRE (or press Enter).</div>
<script>
const W=320,H=200,G=0.12;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const angEl=document.getElementById('ang');
const powEl=document.getElementById('pow');
const fireBtn=document.getElementById('fire');
const msg=document.getElementById('msg');
const who=document.getElementById('who');
const windEl=document.getElementById('wind');
const modeEl=document.getElementById('mode');
const roomEl=document.getElementById('room');
const netEl=document.getElementById('net');

let height,tanks,turn,shot,wind,over,particles;
let peer=null,conn=null,netRole=null,aiTimer=0;
let ac=null;

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function mulberry32(a){
  return function(){
    let t=a+=0x6D2B79F5;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
let rng=mulberry32(1);
function setSeed(s){ rng=mulberry32(s>>>0); }
function srnd(a,b){ return a+rng()*(b-a); }

function audio(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  if(!ac) ac=new AC();
  if(ac.state==='suspended') ac.resume();
  return ac;
}

function tone(freq,dur,type,vol,when,slide){
  const a=audio();
  if(!a) return;
  const t0=a.currentTime+(when||0);
  const o=a.createOscillator();
  const g=a.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(Math.max(1,freq),t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t0+dur);
  g.gain.setValueAtTime(vol||0.07,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}

function noise(dur,vol,when){
  const a=audio();
  if(!a) return;
  const t0=a.currentTime+(when||0);
  const n=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,n,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=a.createBufferSource();
  const g=a.createGain();
  const f=a.createBiquadFilter();
  src.buffer=buf;
  f.type='lowpass';
  f.frequency.setValueAtTime(900,t0);
  f.frequency.exponentialRampToValueAtTime(120,t0+dur);
  g.gain.setValueAtTime(vol||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(f); f.connect(g); g.connect(a.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}

function sfxStart(){
  tone(220,0.08,'square',0.06,0);
  tone(330,0.10,'square',0.06,0.09);
  tone(440,0.16,'square',0.05,0.18);
}

function sfxFire(){
  tone(160,0.18,'sawtooth',0.07,0,55);
  noise(0.12,0.08,0);
}

function sfxHit(){
  noise(0.28,0.18,0);
  tone(90,0.22,'square',0.08,0,40);
}

function sfxGround(){
  noise(0.16,0.11,0);
  tone(70,0.12,'square',0.05,0,28);
}

function makeTerrain(){
  height=new Float32Array(W);
  let y=H*0.62, dy=0;
  for(let x=0;x<W;x++){
    dy+=(rng()-0.5)*1.6;
    dy*=0.92;
    y=clamp(y+dy,H*0.35,H*0.88);
    height[x]=y;
  }
  for(let k=0;k<8;k++){
    const tmp=height.slice();
    for(let x=1;x<W-1;x++) tmp[x]=(height[x-1]+height[x]+height[x+1])/3;
    height=tmp;
  }
}

function groundY(x){
  x=clamp(Math.round(x),0,W-1);
  return height[x];
}

function placeTank(x){
  x=clamp(Math.round(x),8,W-9);
  return {x,y:groundY(x)-4,alive:true};
}

function newWind(){
  wind=Math.round(srnd(-18,18));
  windEl.textContent=(wind>0?'+':'')+wind;
}

function applyReset(seed){
  clearTimeout(aiTimer);
  setSeed(seed);
  makeTerrain();
  tanks=[placeTank(36),placeTank(W-36)];
  turn=0; shot=null; over=false; particles=[];
  newWind();
  who.textContent='1';
  angEl.value=45; powEl.value=50;
  updateControls();
  msg.textContent='Player 1 — set angle + power, then FIRE.';
  sfxStart();
  maybeAI();
}

function reset(){
  audio();
  const seed=(Math.random()*0xFFFFFFFF)>>>0;
  if(conn&&conn.open) send({type:'reset',seed});
  applyReset(seed);
}

function crater(cx,cy,r){
  for(let x=Math.floor(cx-r);x<=cx+r;x++){
    if(x<0||x>=W) continue;
    const dx=x-cx;
    const drop=Math.sqrt(Math.max(0,r*r-dx*dx))*0.85;
    height[x]=Math.min(H-2,height[x]+drop);
  }
  tanks.forEach(t=>{ if(t.alive) t.y=groundY(t.x)-4; });
}

function hitTank(px,py){
  for(let i=0;i<2;i++){
    const t=tanks[i];
    if(!t.alive) continue;
    if(Math.hypot(px-t.x,py-t.y)<6) return i;
  }
  return -1;
}

function vsCPU(){ return !netRole && modeEl.value==='cpu'; }

function canLocalFire(){
  if(over||shot) return false;
  if(netRole==='host') return turn===0;
  if(netRole==='guest') return turn===1;
  if(vsCPU() && turn===1) return false;
  return true;
}

function updateControls(){
  fireBtn.disabled=!canLocalFire();
}

function fire(fromNet){
  if(over||shot) return;
  if(!fromNet && !canLocalFire()) return;
  const t=tanks[turn];
  if(!t||!t.alive) return;
  let a=Number(angEl.value), p=Number(powEl.value);
  a=clamp(a,1,179); p=clamp(p,1,100);
  angEl.value=a; powEl.value=p;
  if(!fromNet && conn && conn.open) send({type:'fire',turn,a,p});
  const dir=turn===0?1:-1;
  const rad=(turn===0?a:180-a)*Math.PI/180;
  const spd=p*0.22;
  shot={x:t.x+dir*6,y:t.y-3,vx:Math.cos(rad)*spd,vy:-Math.sin(rad)*spd};
  fireBtn.disabled=true;
  msg.textContent='Firing...';
  sfxFire();
}

function boom(x,y,big){
  crater(x,y, big?18:14);
  const n=big?52:28;
  for(let i=0;i<n;i++){
    const ang=rnd(0,Math.PI*2);
    const spd=rnd(0.3, big?4.4:2.6);
    const life=rnd(12, big?42:26);
    const smoke=Math.random()<0.4;
    particles.push({
      x,y,
      vx:Math.cos(ang)*spd,
      vy:Math.sin(ang)*spd-rnd(0.4,2.4),
      life,max:life,
      size:smoke?rnd(1.5,3.2):rnd(1, big?3:2),
      kind:smoke?'smoke':'spark'
    });
  }
  particles.push({
    x,y,vx:0,vy:0,
    life:7,max:7,
    size:big?18:11,
    kind:'flash'
  });
}

function stepShot(){
  shot.vx+=wind*0.0016;
  shot.vy+=G;
  shot.x+=shot.vx;
  shot.y+=shot.vy;
  if(shot.x<0||shot.x>=W||shot.y>=H){
    shot=null; endTurn(); return;
  }

  const victim=hitTank(shot.x,shot.y);
  if(victim!==-1){
    tanks[victim].alive=false;
    sfxHit();
    boom(shot.x,shot.y,true);
    const winner=(victim===turn)?1-turn:turn;
    shot=null; over=true;
    msg.textContent='PLAYER '+(winner+1)+' WINS. Press RESET.';
    fireBtn.disabled=true;
    return;
  }

if(shot.y>=groundY(shot.x)){
  const splash=hitTank(shot.x,shot.y);
  boom(shot.x,shot.y, splash!==-1);
  shot=null;
  if(splash!==-1){
    tanks[splash].alive=false;
    sfxHit();
    const winner=(splash===turn)?1-turn:turn;
    over=true;
    msg.textContent='PLAYER '+(winner+1)+' WINS. Press RESET.';
    fireBtn.disabled=true;
  } else {
    sfxGround();
    endTurn();
  }
}
}

function endTurn(){
  turn=1-turn;
  who.textContent=String(turn+1);
  newWind();
  updateControls();
  msg.textContent='Player '+(turn+1)+' — set angle + power, then FIRE.';
  maybeAI();
}

function simLanding(a,p,who,windVal){
  const t=tanks[who];
  const dir=who===0?1:-1;
  const rad=(who===0?a:180-a)*Math.PI/180;
  const spd=p*0.22;
  let x=t.x+dir*6,y=t.y-3,vx=Math.cos(rad)*spd,vy=-Math.sin(rad)*spd;
  for(let i=0;i<400;i++){
    vx+=windVal*0.0016;
    vy+=G;
    x+=vx; y+=vy;
    if(x<0||x>=W||y>=H) return 9999;
    if(y>=groundY(x)){
      const enemy=tanks[1-who];
      return Math.hypot(x-enemy.x,y-enemy.y);
    }
  }
  return 9999;
}

function aiChoose(){
  let best={a:45,p:50,d:1e9};
  for(let a=15;a<=80;a+=3){
    for(let p=25;p<=95;p+=5){
      const d=simLanding(a,p,turn,wind);
      if(d<best.d) best={a,p,d};
    }
  }
  angEl.value=clamp(best.a+rnd(-4,4),1,179);
  powEl.value=clamp(best.p+rnd(-8,8),1,100);
}

function maybeAI(){
  clearTimeout(aiTimer);
  if(!vsCPU()||over||shot) return;
  if(turn!==1) return;
  fireBtn.disabled=true;
  msg.textContent='CPU aiming...';
  aiTimer=setTimeout(()=>{ aiChoose(); fire(true); },600);
}

function drawTank(t,p){
  if(!t.alive){
    ctx.fillStyle='#363';
    ctx.fillRect(t.x-4,t.y-2,8,4);
    return;
  }
  ctx.fillStyle=p===0?'#6f6':'#9f6';
  ctx.fillRect(t.x-5,t.y-3,10,6);
  ctx.fillRect(t.x-2,t.y-6,4,3);
  const a=Number(angEl.value)*Math.PI/180;
  const dir=p===0?1:-1;
  const rad=p===0?a:Math.PI-a;
  ctx.beginPath();
  ctx.moveTo(t.x,t.y-4);
  ctx.lineTo(t.x+Math.cos(rad)*10*dir/dir,t.y-4-Math.sin(a)*8);
  ctx.strokeStyle='#6f6';
  ctx.stroke();
}

function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#030';
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<W;x++) ctx.lineTo(x,height[x]);
  ctx.lineTo(W,H);
  ctx.fill();
  ctx.strokeStyle='#3a3';
  ctx.beginPath();
  for(let x=0;x<W;x++) x===0?ctx.moveTo(x,height[x]):ctx.lineTo(x,height[x]);
  ctx.stroke();
  tanks.forEach((t,i)=>drawTank(t,i));
  if(shot){
    ctx.fillStyle='#afa';
    ctx.fillRect(shot.x-1,shot.y-1,3,3);
  }
  particles.forEach(p=>{
    const t=p.life/(p.max||1);
    if(p.kind==='flash'){
      ctx.fillStyle='rgba(210,255,190,'+(t*0.75)+')';
      ctx.beginPath();
      ctx.arc(p.x,p.y,Math.max(1,p.size),0,Math.PI*2);
      ctx.fill();
    } else if(p.kind==='smoke'){
      ctx.fillStyle='rgba(50,90,50,'+(t*0.4)+')';
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    } else {
      ctx.fillStyle=t>0.65?'#efa':t>0.3?'#6f6':'#363';
      ctx.fillRect(p.x,p.y,p.size,p.size);
    }
  });
}

function tick(){
  if(shot) stepShot();
  particles=particles.filter(p=>{
    p.x+=p.vx;
    p.y+=p.vy;
    if(p.kind==='smoke'){
      p.vx*=0.94;
      p.vy+=0.015;
      p.size+=0.06;
    } else if(p.kind==='flash'){
      p.size*=0.78;
    } else {
      p.vx*=0.99;
      p.vy+=0.09;
    }
    p.life--;
    return p.life>0;
  });
  draw();
  requestAnimationFrame(tick);
}

function send(obj){ if(conn&&conn.open) conn.send(obj); }

function onNet(data){
  if(!data||!data.type) return;
  if(data.type==='reset' && typeof data.seed==='number'){
    applyReset(data.seed);
  }
  if(data.type==='fire'){
    if(shot||over) return;
    if(data.turn!==turn) return;
    angEl.value=data.a;
    powEl.value=data.p;
    fire(true);
  }
}

function setNet(t){ netEl.textContent=t; }

function shortCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';
  for(let i=0;i<4;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

function roomKey(name){
  const s=String(name||'')
    .trim()
    .replace(/^@+/,'')
    .toLowerCase()
    .replace(/[^a-z0-9_-]+/g,'-')
    .replace(/-+/g,'-')
    .replace(/^-|-$/g,'');
  return 'mrchumley-artillery-'+(s||'lobby');
}

function attachConn(c,role){
  conn=c;
  netRole=role;
  modeEl.value='pvp';
  modeEl.disabled=true;
  c.on('data',onNet);
  c.on('close',()=>{
    setNet('disconnected');
    netRole=null;
    conn=null;
    modeEl.disabled=false;
    updateControls();
  });
  c.on('error',()=>setNet('link error'));
}

function hostGame(){
  let name=roomEl.value.trim();
  if(!name){
    name=shortCode();
    roomEl.value=name;
  }
  if(peer) try{ peer.destroy(); }catch(e){}
  peer=new Peer(roomKey(name));
  setNet('starting host…');
  peer.on('open',()=>{
    setNet('hosting '+name+' — wait for join');
  });
  peer.on('connection',c=>{
    attachConn(c,'host');
    c.on('open',()=>{
      setNet('guest connected — you are P1');
      const seed=(Math.random()*0xFFFFFFFF)>>>0;
      send({type:'reset',seed});
      applyReset(seed);
    });
  });
  peer.on('error',e=>{
    if(e.type==='unavailable-id') setNet('name in use — pick another or JOIN');
    else setNet('error '+e.type);
  });
}

function joinGame(){
  const name=roomEl.value.trim();
  if(!name){ setNet('type a room or @handle first'); return; }
  if(peer) try{ peer.destroy(); }catch(e){}
  peer=new Peer();
  setNet('joining '+name+'…');
  peer.on('open',()=>{
    const c=peer.connect(roomKey(name));
    attachConn(c,'guest');
    c.on('open',()=>setNet('connected — you are P2'));
  });
  peer.on('error',e=>setNet('error '+e.type));
}

fireBtn.onclick=()=>{ audio(); fire(); };
document.getElementById('reset').onclick=reset;
document.getElementById('host').onclick=hostGame;
document.getElementById('join').onclick=joinGame;
modeEl.onchange=()=>{ updateControls(); maybeAI(); };
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target!==roomEl) fire();
});

reset();
tick();
</script>
</body>
</html>
